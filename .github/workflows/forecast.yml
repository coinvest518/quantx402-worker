name: forecast
on:
  schedule:
    - cron: "6 * * * *"   # 1h backup; the site dispatches at :05 so the flush lands ~:12 with the hourly core sync
  workflow_dispatch: {}
concurrency:
  group: forecast
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      FORECASTS_LIVE: ${{ vars.FORECASTS_LIVE }}   # "1" = always-on DB first, hourly core sync (repo variable, off by default)
      OUTBOX_DIR: outbox   # used only when SUPABASE_DATABASE_URL is set (split mode)
      SYMBOLS: BTC-USD,ETH-USD,SOL-USD,XRP-USD,BNB-USD,DOGE-USD,ADA-USD,AVAX-USD,LINK-USD,SUI-USD
      LOOKBACK: "360"
      PATHS: "30"
      TEMP: "1.0"
      TOP_P: "0.9"
      TORCH_NUM_THREADS: "4"
      SHARD: ${{ matrix.shard }}
      SHARDS: "5"
      HF_HOME: ${{ github.workspace }}/.hf
      TIMEFRAMES: "1h"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r requirements.txt
      - name: Cache model weights
        uses: actions/cache@v6
        with:
          path: .hf
          key: hf-kronos-small-v1
      - name: Warm weights
        run: python -c "from model import Kronos, KronosTokenizer; KronosTokenizer.from_pretrained('NeoQuasar/Kronos-Tokenizer-base'); Kronos.from_pretrained('NeoQuasar/Kronos-small')"
      - name: Forecast 1h, score outcomes, record run
        env:
          HF_HUB_OFFLINE: "1"
        run: python worker.py
      - name: Upload outbox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outbox-${{ strategy.job-index }}
          path: outbox/
          if-no-files-found: ignore
          retention-days: 1
      - name: Prediction-market snapshot (never fails the job)
        if: always() && matrix.shard == 0
        continue-on-error: true
        timeout-minutes: 3
        env:
          PM_BUDGET_SEC: "50"
        run: python polymarket.py
  flush:
    # One short core-DB write burst per run (all shards), so the core DB sleeps between windows.
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      FORECASTS_LIVE: ${{ vars.FORECASTS_LIVE }}   # "1" = always-on DB first, hourly core sync (repo variable, off by default)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: outbox-*
          path: outbox
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r requirements.txt
      - name: Write all shards to the core DB in one burst
        run: python worker.py flush outbox
