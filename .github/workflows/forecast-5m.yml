name: forecast-5m
# NOT ENABLED: no schedule until Mild approves. Run manually only (workflow_dispatch).
# Long-job loop (SPEC_5m_signal §3 Option B): one job loops ~5.5 h, dispatches its successor ~10 min before exit;
# overlap is deduped by the forecasts unique key. Gaps go to data_quality.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "7 */6 * * *"   # safety relaunch if a handover dispatch fails (enable with Mild's OK)
concurrency:
  group: forecast-5m-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SYMBOLS_5M: BTC-USD,ETH-USD,SOL-USD,XRP-USD
      HORIZON_5M: "12"
      LOOKBACK_5M: "480"
      PATHS_5M: "20"
      TEMP: "1.0"
      TOP_P: "0.9"
      TORCH_NUM_THREADS: "4"
      LOOP_SECONDS: "19800"
      HANDOFF_SECONDS: "600"
      HF_HOME: ${{ github.workspace }}/.hf
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      GH_WORKFLOW: forecast-5m.yml
      GH_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r requirements.txt
      - name: Cache model weights
        uses: actions/cache@v6
        with:
          path: .hf
          key: hf-kronos-small-v1
      - name: Warm weights
        run: python -c "from model import Kronos, KronosTokenizer; KronosTokenizer.from_pretrained('NeoQuasar/Kronos-Tokenizer-base'); Kronos.from_pretrained('NeoQuasar/Kronos-small')"
      - name: 5m loop
        env:
          HF_HUB_OFFLINE: "1"
        run: python loop5m.py
