name: news
on:
  schedule:
    - cron: "7,27,47 * * * *"   # every 20 minutes
  workflow_dispatch: {}
concurrency:
  group: news
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests psycopg[binary]
      - name: Ingest headlines (never fails the job)
        run: python news.py
