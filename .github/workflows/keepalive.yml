name: keepalive
# GitHub disables scheduled workflows in public repos after 60 days without activity.
# This re-enables the forecast workflow monthly through the API (no commits needed).
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch: {}
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow enable forecast.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
